<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExpenseHub 💵 - Login & Signup</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    background: linear-gradient(135deg,#4e73df,#1cc88a);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CONTAINER */
.auth-container{
    width:350px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.9);
    backdrop-filter: blur(15px);
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    text-align:center;
    animation: fadeIn 0.6s ease;
}

/* TITLE */
.auth-container h2{
    margin-bottom:20px;
    color:#000000;
}
.auth-container h1{
    margin-bottom:20px;
    color:#000000;
}
/* MESSAGES */
.message-error{
    background:#ffe6e6;
    color:#e74a3b;
    padding:8px;
    border-radius:8px;
    margin-bottom:10px;
}

.message-success{
    background:#e6fff2;
    color:#1cc88a;
    padding:8px;
    border-radius:8px;
    margin-bottom:10px;
}

/* SWITCH LINK */
.switch-link{
    text-align:center;
    margin-top:12px;
    color:#555;
    font-size:14px;
}

.switch-link a{
    color:#1cc88a;
    font-weight:bold;
}

.switch-link a:hover{
    text-decoration:underline;
}

/* FORM ANIMATION */
.form{
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

</style>

</head>

<body>

<div class="auth-container">

{% if error %}
<p class="message-error">{{ error }}</p>
{% endif %}

{% if success %}
<p class="message-success">{{ success }}</p>
{% endif %}

<!-- LOGIN -->
<div id="loginForm" class="form">
<h1>EXPENSEHUB 💵 </h1>
<h2><i class="fa-solid fa-user"></i> Login</h2>

<form method="POST" action="/login">

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit" class="primary-btn">Login</button>

</form>

<div class="switch-link">
Don't have an account?
<a href="#" onclick="showSignup(event)">Sign Up</a>
</div>

</div>

<!-- SIGNUP -->
<div id="signupForm" class="form" style="display:none;">

<h2><i class="fa-solid fa-user-plus"></i> Sign Up</h2>

<form method="POST" action="/signup">

<input type="text" name="name" placeholder="Full Name" required>

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit" class="primary-btn">Sign Up</button>

</form>

<div class="switch-link">
Already have an account?
<a href="#" onclick="showLogin(event)">Login</a>
</div>

</div>

</div>

<!-- SWITCH SCRIPT -->
<script>

function showSignup(e){
    e.preventDefault();
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("signupForm").style.display = "block";
}

function showLogin(e){
    e.preventDefault();
    document.getElementById("signupForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
}

</script>

</body>
</html>
