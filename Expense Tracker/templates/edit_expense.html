{% extends "base.html" %}

{% block title %}Edit Expense{% endblock %}

{% block content %}

<div class="card">
<h3>Edit Expense ✏️</h3>

<form method="POST" class="form-grid">

<input type="text" name="title" value="{{ expense['title'] }}" required>

<input type="number" step="0.01" name="amount" value="{{ expense['amount'] }}" required>

<select name="category" required>
<option value="">Select Category</option>
{% for cat in categories %}
<option value="{{ cat['name'] }}"
{% if cat['name'] == expense['category'] %}selected{% endif %}>
{{ cat['name'] }}
</option>
{% endfor %}
</select>

<input type="date" name="date" value="{{ expense['date'] }}" required>

<select name="payment" required>
<option value="">Select Payment</option>

<option value="UPI"
{% if expense['payment_mode'] == 'UPI' %}selected{% endif %}>
UPI
</option>

<option value="Credit Card"
{% if expense['payment_mode'] == 'Credit Card' %}selected{% endif %}>
Credit Card
</option>

<option value="Debit Card"
{% if expense['payment_mode'] == 'Debit Card' %}selected{% endif %}>
Debit Card
</option>

<option value="Cash"
{% if expense['payment_mode'] == 'Cash' %}selected{% endif %}>
Cash
</option>

</select>

<button type="submit" class="primary-btn">Update Expense</button>

</form>
</div>

{% endblock %}
