<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Analytics - Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: Arial; background:#f4f6fb; }
        .container { width: 80%; margin: auto; margin-top: 30px; }
        h2 { text-align: center; }
        canvas { background: white; padding: 20px; border-radius: 10px; }
    </style>
</head>

<body>

<div class="container">
    <h2>Expense Analytics</h2>
    <canvas id="expenseChart"></canvas>
</div>

<script>

    const labels = JSON.parse('{{ labels | tojson | safe }}');
    const values = JSON.parse('{{ values | tojson | safe }}');

    const ctx = document.getElementById("expenseChart").getContext("2d");

    new Chart(ctx, {
        type: "pie",
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: [
                    "#ff6384",
                    "#36a2eb",
                    "#ffcd56",
                    "#4bc0c0",
                    "#9966ff"
                ]
            }]
        },
        options: {
            responsive: true
        }
    });
</script>
</body>
</html>
